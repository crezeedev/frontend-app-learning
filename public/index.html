  <!-- estilos para ocultar botones -->
<style>
    /* Oculta los contenedores de My Courses y Discover en el header del curso */
    .course-title-lockup .nav-course {
        display: none !important;
    }

    /*Oculta el boton de Discover solo en este MFE*/

        display: none !important;
        visibility: hidden !important;
        height: 0 !important;

</style>
<!-- modificar footer y bontes de ayuda -->
<script>
  //boton ayuda
(function () {
  const NEW_URL = "https://onlinelive.universidadriviera.edu.mx/contact";
  const NEW_TEXT = "Ayuda";

  function fixAyudaLink() {
    const links = document.querySelectorAll('a.text-gray-700.ml-2');

    for (const link of links) {
      const rawHref = link.getAttribute("href");

      if (rawHref === "null" || rawHref === "" || rawHref === null) {
        link.setAttribute("href", NEW_URL);
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
	link.textContent = NEW_TEXT;
        return true;
      }
    }
    return false;
  }


  // Intento inmediato
  if (fixAyudaLink()) return;

  // Observa cambios del DOM (React)
  const observer = new MutationObserver(() => {
    if (fixAyudaLink()) observer.disconnect();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();
//footer
(function () {
  function translateAndClean() {

  
    // 2. Traducir Copyrights con una técnica de reemplazo total
    const copyright = document.querySelector('.copyright-site');
    if (copyright && copyright.textContent.includes('All Rights Reserved')) {
      // Usamos innerHTML para forzar el cambio y reemplazamos las dos partes
      let text = copyright.innerHTML;
      text = text.replace('Copyrights', 'Derechos de autor');
      text = text.replace('All Rights Reserved', 'Todos los derechos reservados');
      copyright.innerHTML = text;
    }

    const postDiscuss = document.querySelector('.font-style');
    if(postDiscuss && postDiscuss.textContent.includes('All  posts  sorted by recent activity')){
      // Usamos innerHTML para forzar el cambio y reemplazamos las dos partes
      let textDiscuss = postDiscuss.innerHTML;
      textDiscuss = textDiscuss.replace('All  posts  sorted by recent activity', 'Todas las publicaciones ordenadas por actividad reciente');
      postDiscuss.innerHTML = textDiscuss;
    }
  }

  // Ejecución inicial con un pequeño retraso para asegurar que el footer cargó
  setTimeout(translateAndClean, 500);

  // Observador para cambios del DOM
  const observer = new MutationObserver((mutations) => {
    // Solo ejecutamos si hay cambios reales para evitar bucles infinitos
    translateAndClean();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();


//=====================menu learning==========================
(function () {

  function translateMenu() {

    const translations = {
      "My Courses": "Mis cursos",
      "Discover": "Explorar",
      "Dashboard": "Panel",
      "Profile": "Perfil",
      "Account": "Cuenta",
      "Sign Out": "Cerrar sesión"
    };

    const dropdownItems = document.querySelectorAll('.dropdown-item');

    dropdownItems.forEach(item => {
      const text = item.textContent.trim();
      if (translations[text]) {
        item.textContent = translations[text];
      }
    });
  }

  setTimeout(translateMenu, 500);

  const observer = new MutationObserver(() => {
    translateMenu();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();

</script>
<!-- fechas -->
<script>
(function () {

  function translateDashboardDates() {

    const translations = {
      "Course starts": "Inicio del curso",
      "Course ends": "Fin del curso",
      "Assignment due": "Entrega de tarea",
      "Verification deadline": "Fecha límite de verificación",
      "After this date, the course will be archived, which means you can review the course content but can no longer participate in graded assignments or work towards earning a certificate." : "Después de esa fecha, el curso será archivado, lo que significa que podrás revisar el contenido pero ya no podrás participar en trabajos calificados ni trabajar para obtener un certificado.",
      "This course is archived, which means you can review course content but it is no longer active." : "Este curso está archivado, lo que significa que puedes revisar el contenido del curso, pero ya no está activo.",
      "After the course ends, the course content will be archived and no longer active." : "Después de que termine el curso, el contenido del curso será archivado y ya no estará activo."
    };

    // Busca todos los textos
    const elements = document.querySelectorAll('span, div, strong');

    elements.forEach(el => {
      const text = el.textContent.trim();

      if (translations[text]) {
        el.textContent = translations[text];
      }
    });
  }

  // Ejecuta después de que cargue el MFE
  setTimeout(translateDashboardDates, 800);

  // Observa cambios dinámicos (porque el MFE es React)
  const observer = new MutationObserver(() => {
    translateDashboardDates();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>

<!-- powered by -->
<script>
(function () {

  function customizeFooterLogos() {

    // Cambiar texto "Powered by"
    const poweredByItems = document.querySelectorAll('.logo-list li');

    poweredByItems.forEach(li => {
      if (li.textContent.trim() === "Powered by") {
        li.textContent = "Desarrollado por";
      }
    });

    const alertsLearning = document.querySelectorAll('.alert-message-content');

    alertsLearning.forEach(al => {
      if(al.textContent.trim() === "This section is a prerequisite. You must complete this section in order to unlock additional content."){
        al.textContent = "Esta sección es un requisito previo. Debes completar esta sección para desbloquear contenido adicional.";
      }
    });

    // Cambiar logo de Open edX por logo-crezee.png
    const logos = document.querySelectorAll('.logo-list img');

    logos.forEach(img => {
      if (img.src.includes("tutor-logo")) {
        img.src = "https://onlinelive.universidadriviera.edu.mx/theming/asset/images/logo-crezee.png";
        img.alt = "Crezee";
        img.width = 120;
      }
    });

  }

  // Ejecutar después de cargar
  setTimeout(customizeFooterLogos, 800);

  // Observar cambios (porque es React/MFE)
  const observer = new MutationObserver(() => {
    customizeFooterLogos();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>

<script>
(function () {

  function translateQuestions() {

    const elements = document.querySelectorAll('a, span, div, small, strong');

    elements.forEach(el => {

      if (el.children.length > 0) return;

      let text = el.textContent;

      // 1 Question -> 1 Pregunta
      text = text.replace(/(\d+)\s+Question\b/g, '$1 Pregunta');

      // 2 Questions -> 2 Preguntas
      text = text.replace(/(\d+)\s+Questions\b/g, '$1 Preguntas');

      if (text !== el.textContent) {
        el.textContent = text;
      }

    });

  }

  // Primera ejecución
  setTimeout(translateQuestions, 800);

  // React/MFE
  const observer = new MutationObserver(() => {
    translateQuestions();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>

<script>
(function () {

    console.log('[Open edX ES] Iniciando traducción...');

    const translations = [

        // ==========================================
        // TIPOS DE PREGUNTA
        // ==========================================

        [/^Single select$/i, 'Selección única'],
        [/^Multiple select$/i, 'Selección múltiple'],
        [/^Single choice$/i, 'Opción única'],
        [/^Multiple choice$/i, 'Opción múltiple'],
        [/^Dropdown$/i, 'Lista desplegable'],
        [/^Text input$/i, 'Entrada de texto'],
        [/^Numerical input$/i, 'Entrada numérica'],

        // ==========================================
        // QUESTION
        // ==========================================

        [/^Question$/i, 'Pregunta'],

        [/^Question\s+(\d+)$/i, 'Pregunta $1'],

        [/^(\d+)\s+Question$/i, '$1 Pregunta'],

        [/^(\d+)\s+Questions$/i, '$1 Preguntas'],

        // ==========================================
        // RESULTADOS
        // ==========================================

        [/^Correct$/i, 'Correcta'],
        [/^Incorrect$/i, 'Incorrecta'],

        [/^Correct answer$/i, 'Respuesta correcta'],
        [/^Incorrect answer$/i, 'Respuesta incorrecta'],

        [/^This answer is correct\.$/i, 'Esta respuesta es correcta.'],
        [/^This answer is incorrect\.$/i, 'Esta respuesta es incorrecta.'],

        // ==========================================
        // RESULTADO + PUNTOS
        // ==========================================

        /^Correct\s+(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*points?$/i,
        /^Incorrect\s+(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*points?$/i,

        // ==========================================
        // BOTONES
        // ==========================================

        [/^Show answer$/i, 'Mostrar respuesta'],
        [/^Hide answer$/i, 'Ocultar respuesta'],

        [/^Submit$/i, 'Enviar'],
        [/^Submitting$/i, 'Enviando'],

        [/^Review$/i, 'Revisar'],

        [/^Save$/i, 'Guardar'],
        [/^Reset$/i, 'Restablecer'],

        // ==========================================
        // MENSAJES
        // ==========================================

        [
            /^Answers are displayed within the problem$/i,
            'Las respuestas se muestran dentro de la pregunta'
        ],

        [
            /^Some problems have options such as save, reset, hints, or show answer\. These options follow the Submit button\.$/i,
            'Algunas preguntas tienen opciones como guardar, restablecer, pistas o mostrar respuesta. Estas opciones aparecen después del botón Enviar.'
        ],

        // ==========================================
        // PUNTOS
        // ==========================================

        [
            /^(\d+(?:\.\d+)?)\s+point$/i,
            '$1 punto'
        ],

        [
            /^(\d+(?:\.\d+)?)\s+points$/i,
            '$1 puntos'
        ]

    ];


    // ==================================================
    // TRADUCIR TEXTO
    // ==================================================

    function translateText(text) {

        if (!text) {
            return text;
        }

        let value = text.trim();

        if (!value) {
            return text;
        }


        // ------------------------------------------
        // Casos especiales de Correct X/X point
        // ------------------------------------------

        let match = value.match(
            /^Correct\s+(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*points?$/i
        );

        if (match) {
            return value.replace(
                /^Correct\s+(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*points?$/i,
                'Correcta $1/$2 punto'
            );
        }


        match = value.match(
            /^Incorrect\s+(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*points?$/i
        );

        if (match) {
            return value.replace(
                /^Incorrect\s+(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*points?$/i,
                'Incorrecta $1/$2 punto'
            );
        }


        // ------------------------------------------
        // Traducciones normales
        // ------------------------------------------

        for (const item of translations) {

            if (!Array.isArray(item)) {
                continue;
            }

            const regex = item[0];
            const replacement = item[1];

            if (regex.test(value)) {

                return value.replace(
                    regex,
                    replacement
                );

            }

        }

        return text;
    }


    // ==================================================
    // RECORRER TODOS LOS TEXT NODES
    // ==================================================

    function translateTextNodes(root) {

        if (!root) {
            return;
        }

        const walker = document.createTreeWalker(
            root,
            NodeFilter.SHOW_TEXT,
            {
                acceptNode: function (node) {

                    // Ignorar scripts y estilos
                    const parent = node.parentElement;

                    if (!parent) {
                        return NodeFilter.FILTER_REJECT;
                    }

                    const tag = parent.tagName.toLowerCase();

                    if (
                        tag === 'script' ||
                        tag === 'style' ||
                        tag === 'noscript'
                    ) {
                        return NodeFilter.FILTER_REJECT;
                    }

                    return NodeFilter.FILTER_ACCEPT;
                }
            }
        );


        const nodes = [];

        let node;

        while (node = walker.nextNode()) {
            nodes.push(node);
        }


        nodes.forEach(function (textNode) {

            const original = textNode.nodeValue;

            const translated = translateText(original);

            if (translated !== original) {

                console.log(
                    '[Open edX ES]',
                    original.trim(),
                    '→',
                    translated.trim()
                );

                textNode.nodeValue = translated;
            }

        });

    }


    // ==================================================
    // ATRIBUTOS
    // ==================================================

    function translateAttributes() {

        // aria-label
        document.querySelectorAll('[aria-label]').forEach(function (el) {

            const original = el.getAttribute('aria-label');

            if (!original) {
                return;
            }

            const translated = translateText(original);

            if (translated !== original) {
                el.setAttribute(
                    'aria-label',
                    translated
                );
            }

        });


        // title
        document.querySelectorAll('[title]').forEach(function (el) {

            const original = el.getAttribute('title');

            if (!original) {
                return;
            }

            const translated = translateText(original);

            if (translated !== original) {
                el.setAttribute(
                    'title',
                    translated
                );
            }

        });


        // data-tooltip
        document.querySelectorAll('[data-tooltip]').forEach(function (el) {

            const original = el.getAttribute('data-tooltip');

            if (!original) {
                return;
            }

            const translated = translateText(original);

            if (translated !== original) {
                el.setAttribute(
                    'data-tooltip',
                    translated
                );
            }

        });


        // data-submitting
        document.querySelectorAll('[data-submitting]').forEach(function (el) {

            const original = el.getAttribute('data-submitting');

            if (!original) {
                return;
            }

            const translated = translateText(original);

            if (translated !== original) {
                el.setAttribute(
                    'data-submitting',
                    translated
                );
            }

        });

    }


    // ==================================================
    // TRADUCCIÓN ESPECÍFICA DEL PROBLEM
    // ==================================================

    function translateProblem() {

        // Encabezado:
        // Single select
        document.querySelectorAll(
            '.problem-header'
        ).forEach(function (el) {

            const original = el.textContent.trim();

            const translated = translateText(original);

            if (translated !== original) {

                el.textContent = translated;

            }

        });


        // Show answer
        document.querySelectorAll(
            '.show-label'
        ).forEach(function (el) {

            const original = el.textContent.trim();

            const translated = translateText(original);

            if (translated !== original) {

                el.textContent = translated;

            }

        });


        // Correct / Incorrect
        document.querySelectorAll(
            '.choicegroup_correct .sr, .status .sr'
        ).forEach(function (el) {

            const original = el.textContent.trim();

            const translated = translateText(original);

            if (translated !== original) {

                el.textContent = translated;

            }

        });

    }


    // ==================================================
    // FUNCIÓN PRINCIPAL
    // ==================================================

    function translateOpenEdx() {

        try {

            translateTextNodes(document.body);

            translateAttributes();

            translateProblem();

        } catch (error) {

            console.error(
                '[Open edX ES] Error:',
                error
            );

        }

    }


    // ==================================================
    // EJECUCIONES INICIALES
    // ==================================================

    translateOpenEdx();

    setTimeout(translateOpenEdx, 300);
    setTimeout(translateOpenEdx, 800);
    setTimeout(translateOpenEdx, 1500);
    setTimeout(translateOpenEdx, 3000);
    setTimeout(translateOpenEdx, 5000);


    // ==================================================
    // OBSERVER PARA REACT / MFE / OPENEDX
    // ==================================================

    const observer = new MutationObserver(function () {

        translateOpenEdx();

    });


    observer.observe(document.body, {

        childList: true,
        subtree: true,
        characterData: true

    });


    // ==================================================
    // RESPALDO
    // ==================================================

    setInterval(function () {

        translateOpenEdx();

    }, 3000);


    console.log(
        '[Open edX ES] Traducción activada correctamente.'
    );

})();
</script>

</html>
