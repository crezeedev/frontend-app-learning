<!doctype html>
<html lang="es-419">
  <head>
    <title>Course | <%= process.env.SITE_NAME %></title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="<%=htmlWebpackPlugin.options.FAVICON_URL%>" type="image/x-icon" />

    <% if (htmlWebpackPlugin.options.OPTIMIZELY_PROJECT_ID) { %>
      <script src="https://www.edx.org/optimizelyjs/<%= htmlWebpackPlugin.options.OPTIMIZELY_PROJECT_ID %>.js"></script>
    <% } %>
  </head>
  <body>
    <div id="root"></div>
  </body>
  <!-- estilos para ocultar botones -->
<style>
    /* Oculta los contenedores de My Courses y Discover en el header del curso */
    .course-title-lockup .nav-course {
        display: none !important;
    }

    /*Oculta el boton de Discover solo en este MFE*/
    .pgn__dropdown.user-dropdown.show
      .dropdown-menu-right.dropdown-menu.show
      a.dropdown-item[href*="/courses"] {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        padding: 0 !important;
    }
</style>
<!-- modificar footer y bontes de ayuda -->
<script>
  //boton ayuda
(function () {
  const NEW_URL = "https://onlinelive.universidadriviera.edu.mx/contact";
  const NEW_TEXT = "Ayuda";

  function fixAyudaLink() {
    const links = document.querySelectorAll('a.text-gray-700.ml-2');

    for (const link of links) {
      const rawHref = link.getAttribute("href");

      if (rawHref === "null" || rawHref === "" || rawHref === null) {
        link.setAttribute("href", NEW_URL);
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
	link.textContent = NEW_TEXT;
        return true;
      }
    }
    return false;
  }


  // Intento inmediato
  if (fixAyudaLink()) return;

  // Observa cambios del DOM (React)
  const observer = new MutationObserver(() => {
    if (fixAyudaLink()) observer.disconnect();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();
//footer
(function () {
  function translateAndClean() {

  
    // 2. Traducir Copyrights con una técnica de reemplazo total
    const copyright = document.querySelector('.copyright-site');
    if (copyright && copyright.textContent.includes('All Rights Reserved')) {
      // Usamos innerHTML para forzar el cambio y reemplazamos las dos partes
      let text = copyright.innerHTML;
      text = text.replace('Copyrights', 'Derechos de autor');
      text = text.replace('All Rights Reserved', 'Todos los derechos reservados');
      copyright.innerHTML = text;
    }

    const postDiscuss = document.querySelector('.font-style');
    if(postDiscuss && postDiscuss.textContent.includes('All  posts  sorted by recent activity')){
      // Usamos innerHTML para forzar el cambio y reemplazamos las dos partes
      let textDiscuss = postDiscuss.innerHTML;
      textDiscuss = textDiscuss.replace('All  posts  sorted by recent activity', 'Todas las publicaciones ordenadas por actividad reciente');
      postDiscuss.innerHTML = textDiscuss;
    }
  }

  // Ejecución inicial con un pequeño retraso para asegurar que el footer cargó
  setTimeout(translateAndClean, 500);

  // Observador para cambios del DOM
  const observer = new MutationObserver((mutations) => {
    // Solo ejecutamos si hay cambios reales para evitar bucles infinitos
    translateAndClean();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();


//=====================menu learning==========================
(function () {

  function translateMenu() {

    const translations = {
      "My Courses": "Mis cursos",
      "Discover": "Explorar",
      "Dashboard": "Panel",
      "Profile": "Perfil",
      "Account": "Cuenta",
      "Sign Out": "Cerrar sesión"
    };

    const dropdownItems = document.querySelectorAll('.dropdown-item');

    dropdownItems.forEach(item => {
      const text = item.textContent.trim();
      if (translations[text]) {
        item.textContent = translations[text];
      }
    });
  }

  setTimeout(translateMenu, 500);

  const observer = new MutationObserver(() => {
    translateMenu();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();

</script>
<!-- fechas -->
<script>
(function () {

  function translateDashboardDates() {

    const translations = {
      "Course starts": "Inicio del curso",
      "Course ends": "Fin del curso",
      "Assignment due": "Entrega de tarea",
      "Verification deadline": "Fecha límite de verificación",
      "After this date, the course will be archived, which means you can review the course content but can no longer participate in graded assignments or work towards earning a certificate." : "Después de esa fecha, el curso será archivado, lo que significa que podrás revisar el contenido pero ya no podrás participar en trabajos calificados ni trabajar para obtener un certificado.",
      "This course is archived, which means you can review course content but it is no longer active." : "Este curso está archivado, lo que significa que puedes revisar el contenido del curso, pero ya no está activo.",
      "After the course ends, the course content will be archived and no longer active." : "Después de que termine el curso, el contenido del curso será archivado y ya no estará activo."
    };

    // Busca todos los textos
    const elements = document.querySelectorAll('span, div, strong');

    elements.forEach(el => {
      const text = el.textContent.trim();

      if (translations[text]) {
        el.textContent = translations[text];
      }
    });
  }

  // Ejecuta después de que cargue el MFE
  setTimeout(translateDashboardDates, 800);

  // Observa cambios dinámicos (porque el MFE es React)
  const observer = new MutationObserver(() => {
    translateDashboardDates();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>

<!-- powered by -->
<script>
(function () {

  function customizeFooterLogos() {

    // Cambiar texto "Powered by"
    const poweredByItems = document.querySelectorAll('.logo-list li');

    poweredByItems.forEach(li => {
      if (li.textContent.trim() === "Powered by") {
        li.textContent = "Desarrollado por";
      }
    });

    const alertsLearning = document.querySelectorAll('.alert-message-content');

    alertsLearning.forEach(al => {
      if(al.textContent.trim() === "This section is a prerequisite. You must complete this section in order to unlock additional content."){
        al.textContent = "Esta sección es un requisito previo. Debes completar esta sección para desbloquear contenido adicional.";
      }
    });

    // Cambiar logo de Open edX por logo-crezee.png
    const logos = document.querySelectorAll('.logo-list img');

    logos.forEach(img => {
      if (img.src.includes("tutor-logo")) {
        img.src = "https://onlinelive.universidadriviera.edu.mx/theming/asset/images/logo-crezee.png";
        img.alt = "Crezee";
        img.width = 120;
      }
    });

  }

  // Ejecutar después de cargar
  setTimeout(customizeFooterLogos, 800);

  // Observar cambios (porque es React/MFE)
  const observer = new MutationObserver(() => {
    customizeFooterLogos();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>

<script>
  (function () {

  function translateQuestions() {

    document.querySelectorAll('a, span, div, small, strong').forEach(el => {

      if (el.children.length) return;

      el.textContent = el.textContent.replace(
        /(\d+)\s+Question(s)?\b/g,
        (_, num, plural) => `${num} ${plural ? 'Preguntas' : 'Pregunta'}`
      );

    });

  }

  setTimeout(translateQuestions, 800);

  new MutationObserver(translateQuestions).observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>

</html>
